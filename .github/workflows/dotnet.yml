name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore NativeCompiler.sln

    - name: Build
      run: dotnet build NativeCompiler.sln --no-restore -c Release

    - name: Test
      run: dotnet test NativeCompiler.sln --no-build -c Release --nologo