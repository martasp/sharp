name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Sharp.sln

    # Fixture projects under testProjects/ and tests/TestExampleProjects/ are deliberately
    # outside Sharp.sln, so `dotnet restore Sharp.sln` does not cover them.
    # A cold clone has no obj/ assets, and the parity tests compare our output against the SDK's
    # build of these same projects, so both must exist before the suite runs.
    # PackageCacheFixtures is restore-only: it pins the exact packages NuGetTests reads out of the
    # global cache as data, so those assertions do not depend on a warm machine cache.
    - name: Restore test fixtures
      run: |
        find testProjects tests/TestExampleProjects tests/PackageCacheFixtures -name '*.csproj' -print0 \
          | xargs -0 -n1 dotnet restore

    # Tests build Debug: the parity tests compare against paths under bin/Debug, and
    # BootstrapPipelineTests plus the published-AOT benchmark need a Release publish of the CLI.
    - name: Build
      run: dotnet build Sharp.sln --no-restore -c Debug

    - name: Publish AOT compiler
      run: dotnet publish src/Sharp.Cli/Sharp.Cli.csproj -r linux-x64 -c Release

    # Benchmarks (Category=Benchmark) run with the suite by default and write their captures to
    # benchmarks/. No filter excludes them, so a regression in comparison output fails the build.
    - name: Test
      run: dotnet test Sharp.sln --no-build -c Debug --nologo