name: Release

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binaries (e.g. v0.1.0). Manual runs build artifacts only."
        required: false
        default: ""

permissions:
  contents: read

env:
  PROJECT: "src/Sharp.Cli/Sharp.Cli.csproj"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      preview: ${{ steps.plan.outputs.preview }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              version="$(tr -d '[:space:]' < VERSION)"
              tag="v${version}-preview.${PR_NUMBER}"
              preview=true
              publish=true
              ;;
            push)
              if [[ "$REF_TYPE" == "tag" ]]; then
                tag="$REF_NAME"
                version="${tag#v}"
                preview=false
                publish=true
              else
                version="$(tr -d '[:space:]' < VERSION)"
                tag="v${version}"
                preview=false
                if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
                  publish=false
                else
                  publish=true
                fi
              fi
              ;;
            workflow_dispatch)
              tag="$INPUT_VERSION"
              if [[ -z "$tag" ]]; then
                version="$(tr -d '[:space:]' < VERSION)"
                tag="v${version}"
              fi
              tag="v${tag#v}"
              version="${tag#v}"
              preview=false
              publish=true
              ;;
            *)
              echo "::error::Unsupported event '$EVENT_NAME'"
              exit 1
              ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected e.g. 0.1.0)"
            exit 1
          fi

          {
            echo "publish=$publish"
            echo "preview=$preview"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  linux-x64:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish "$PROJECT" -r linux-x64 -c Release -p:Version="${{ needs.plan.outputs.version }}" -o dist
      - name: Package
        run: |
          mkdir -p package/sharp-linux-x64
          cp dist/Sharp.Cli package/sharp-linux-x64/sharp
          chmod 0755 package/sharp-linux-x64/sharp
          cp LICENSE README.md NOTICE.md package/sharp-linux-x64/
          tar -C package -czf sharp-linux-x64.tar.gz sharp-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sharp-linux-x64
          path: sharp-linux-x64.tar.gz
          if-no-files-found: error

  windows-x64:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        shell: pwsh
        run: dotnet publish $env:PROJECT -r win-x64 -c Release -p:Version=${{ needs.plan.outputs.version }} -o dist
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/sharp-windows-x64 | Out-Null
          Copy-Item dist/Sharp.Cli.exe package/sharp-windows-x64/sharp.exe
          Copy-Item LICENSE, README.md, NOTICE.md package/sharp-windows-x64/
          Compress-Archive -Path package/sharp-windows-x64 -DestinationPath sharp-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sharp-windows-x64
          path: sharp-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [ plan, linux-x64, windows-x64 ]
    if: |
      needs.plan.outputs.publish == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum sharp-linux-x64.tar.gz sharp-windows-x64.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIEW: ${{ needs.plan.outputs.preview }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$PREVIEW" == "true" ]]; then
            gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          args=(--title "$TAG" --generate-notes)
          if [[ "$PREVIEW" == "true" ]]; then
            args+=(--prerelease)
          else
            case "$TAG" in
              *-*) args+=(--prerelease) ;;
            esac
          fi
          if [[ "$REF_TYPE" != "tag" ]]; then
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${args[@]}" \
            dist/sharp-linux-x64.tar.gz \
            dist/sharp-windows-x64.zip \
            dist/SHA256SUMS
